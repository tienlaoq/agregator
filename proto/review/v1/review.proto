syntax = "proto3";

package review.v1;

option go_package = "github.com/tienlao/agregator/proto/review/v1;reviewv1";

import "google/protobuf/timestamp.proto";

service ReviewService {
  rpc CreateReview(CreateReviewRequest) returns (ReviewResponse);
  rpc GetReview(GetReviewRequest) returns (ReviewResponse);
  rpc ListVenueReviews(ListVenueReviewsRequest) returns (ListReviewsResponse);
  rpc ListMasterReviews(ListMasterReviewsRequest) returns (ListReviewsResponse);
  rpc GetVenueRating(GetVenueRatingRequest) returns (VenueRatingResponse);
  rpc GetMasterRating(GetMasterRatingRequest) returns (MasterRatingResponse);

  // Owner-side review management. Venue ownership is verified by the caller
  // (api-gateway) before these are invoked; venue_id is passed so the service
  // can scope the reply to a review that actually belongs to that venue.
  rpc ReplyToReview(ReplyToReviewRequest) returns (ReviewReply);
  rpc DeleteReviewReply(DeleteReviewReplyRequest) returns (DeleteReviewReplyResponse);
  rpc GetVenueReviewSummary(GetVenueReviewSummaryRequest) returns (VenueReviewSummaryResponse);
}

message CreateReviewRequest {
  string user_id = 1;
  string venue_id = 2;
  int32 rating = 3; // 1-5
  string text = 4;
  bool is_anonymous = 5;
  string user_name = 6;
  string master_id = 7;
}

message GetReviewRequest {
  string id = 1;
}

message ReviewResponse {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string venue_id = 4;
  int32 rating = 5;
  string text = 6;
  bool is_verified = 7;
  google.protobuf.Timestamp created_at = 8;
  bool is_anonymous = 9;
  string master_id = 10;
  ReviewReply owner_reply = 11; // set when the venue owner has replied; nil otherwise
}

// ReviewReply is the venue owner's public response to a review.
message ReviewReply {
  string body = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ListVenueReviewsRequest {
  string venue_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  bool only_unanswered = 4; // owner triage: return only reviews without an owner reply
}

message ReplyToReviewRequest {
  string review_id = 1;
  string venue_id = 2;       // ownership scope: reply is rejected if the review is not for this venue
  string author_user_id = 3; // owner who authored the reply
  string body = 4;
}

message DeleteReviewReplyRequest {
  string review_id = 1;
  string venue_id = 2; // ownership scope
}

message DeleteReviewReplyResponse {}

message GetVenueReviewSummaryRequest {
  string venue_id = 1;
}

message VenueReviewSummaryResponse {
  string venue_id = 1;
  double avg_rating = 2;
  int32 review_count = 3;
  int32 unanswered_count = 4;
}

message ListReviewsResponse {
  repeated ReviewResponse reviews = 1;
  int32 total = 2;
}

message ListMasterReviewsRequest {
  string master_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetVenueRatingRequest {
  string venue_id = 1;
}

message VenueRatingResponse {
  string venue_id = 1;
  double avg_rating = 2;
  int32 review_count = 3;
}

message GetMasterRatingRequest {
  string master_id = 1;
}

message MasterRatingResponse {
  string master_id = 1;
  double avg_rating = 2;
  int32 review_count = 3;
}
