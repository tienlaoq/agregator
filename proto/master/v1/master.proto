syntax = "proto3";

package master.v1;

option go_package = "github.com/tienlao/agregator/gen/go/master/v1;masterv1";

import "google/protobuf/timestamp.proto";

service MasterService {
  rpc CreateMyProfile(CreateMyProfileRequest) returns (MasterResponse);
  rpc GetMyProfile(GetMyProfileRequest) returns (MasterResponse);
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (MasterResponse);
  rpc SubmitForReview(SubmitMasterForReviewRequest) returns (MasterResponse);

  rpc ListPublicMasters(ListPublicMastersRequest) returns (ListMastersResponse);
  rpc GetPublicMaster(GetPublicMasterRequest) returns (MasterResponse);

  rpc ListForModeration(ListForModerationRequest) returns (ListMastersResponse);
  rpc ModerateMaster(ModerateMasterRequest) returns (MasterResponse);
  rpc ListModerationHistory(ListModerationHistoryRequest) returns (ListModerationHistoryResponse);

  rpc CreateMasterBooking(CreateMasterBookingRequest) returns (MasterBookingResponse);
  rpc ListMyMasterBookings(ListMyMasterBookingsRequest) returns (ListMasterBookingsResponse);
  rpc ListClientMasterBookings(ListClientMasterBookingsRequest) returns (ListMasterBookingsResponse);
  rpc GetMasterBooking(GetMasterBookingRequest) returns (MasterBookingResponse);
  rpc GetMasterBookingsBatch(GetMasterBookingsBatchRequest) returns (GetMasterBookingsBatchResponse);
  rpc HasCompletedMasterBooking(HasCompletedMasterBookingRequest) returns (HasCompletedMasterBookingResponse);

  rpc AddMasterPhoto(AddMasterPhotoRequest) returns (MasterResponse);
  rpc DeleteMasterPhoto(DeleteMasterPhotoRequest) returns (DeleteMasterPhotoResponse);
  rpc SetMasterCoverPhoto(SetMasterCoverPhotoRequest) returns (MasterResponse);
}

message MasterServiceItem {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 duration_min = 4;
  int64 price = 5;
  int32 sort_order = 6;
}

message MasterServiceItemInput {
  optional string id = 1;
  string name = 2;
  string description = 3;
  int32 duration_min = 4;
  int64 price = 5;
  // optional: omitting sort_order means "assign position by list index".
  // Sending sort_order = 0 explicitly pins the item at position 0.
  optional int32 sort_order = 6;
}

message MasterPhoto {
  string id = 1;
  string url = 2;
  int32 sort_order = 3;
  bool is_cover = 4;
}

// Круг на карте: центр + радиус в км — «сюда не выезжаю» внутри общей зоны.
message MasterTravelExcludeZone {
  string id = 1;
  double latitude = 2;
  double longitude = 3;
  double radius_km = 4;
  string label = 5;
}

message Master {
  string id = 1;
  string user_id = 2;
  string slug = 3;
  string display_name = 4;
  string bio = 5;
  string phone = 6;
  string city = 7;
  string work_format = 8;
  int32 travel_radius_km = 9;
  // Точка отсчёта радиуса выезда (широта/долгота), если мастер принимает выезд.
  optional double travel_base_latitude = 23;
  optional double travel_base_longitude = 24;
  repeated MasterTravelExcludeZone travel_exclude_zones = 25;
  int32 experience_years = 10;
  repeated string specializations = 11;
  int64 hourly_rate = 12;
  string availability_json = 13;
  string status = 14;
  string moderation_comment = 15;
  optional string moderated_by = 16;
  optional google.protobuf.Timestamp moderated_at = 17;
  repeated MasterServiceItem services = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  repeated MasterPhoto photos = 21;
  // ip | ooo | individual | self_employed — куда перечисляется оплата; в публичном API не отдаётся.
  string payout_legal_form = 22;
  // ЮKassa account_id подключенного получателя (для marketplace split).
  string yookassa_seller_account_id = 26;
  string payout_legal_name = 27;
  string payout_inn = 28;
  string payout_kpp = 29;
  string payout_ogrn = 30;
  string payout_ogrnip = 31;
  string payout_bank_name = 32;
  string payout_bik = 33;
  string payout_settlement_account = 34;
  string payout_correspondent_account = 35;
  string payout_verification_status = 36; // unverified | pending | verified | rejected
  bool payout_ready = 37;
}

message MasterResponse {
  Master master = 1;
}

message CreateMyProfileRequest {
  string user_id = 1;
  string display_name = 2;
}

message GetMyProfileRequest {
  string user_id = 1;
}

message UpdateMyProfileRequest {
  string user_id = 1;
  optional string display_name = 2;
  optional string bio = 3;
  optional string phone = 4;
  optional string city = 5;
  optional string work_format = 6;
  optional int32 travel_radius_km = 7;
  optional double travel_base_latitude = 16;
  optional double travel_base_longitude = 17;
  optional int32 experience_years = 8;
  repeated string specializations = 9;
  optional int64 hourly_rate = 10;
  optional string availability_json = 11;
  repeated MasterServiceItemInput services_replace = 12;
  // When true, replace all services with services_replace (empty list clears services).
  bool apply_services_replace = 13;
  // When true, replace specializations with the repeated field (empty clears).
  bool apply_specializations = 14;
  optional string payout_legal_form = 15;
  optional string yookassa_seller_account_id = 20;
  optional string payout_legal_name = 21;
  optional string payout_inn = 22;
  optional string payout_kpp = 23;
  optional string payout_ogrn = 24;
  optional string payout_ogrnip = 25;
  optional string payout_bank_name = 26;
  optional string payout_bik = 27;
  optional string payout_settlement_account = 28;
  optional string payout_correspondent_account = 29;
  optional string payout_verification_status = 30;
  // При true заменить travel_exclude_zones на переданный список (пустой — очистить).
  bool apply_travel_exclude_zones = 18;
  repeated MasterTravelExcludeZone travel_exclude_zones = 19;
}

message SubmitMasterForReviewRequest {
  string user_id = 1;
}

message ListPublicMastersRequest {
  // Устарело: используйте cities; gateway может дублировать один город сюда для совместимости.
  string city = 1;
  int32 limit = 2;
  int32 offset = 3;
  string q = 4;
  repeated string cities = 5;
  // Пусто или "all" — без фильтра; иначе mobile | venue | both.
  string work_format = 6;
  int64 price_min_kopecks = 7;
  int64 price_max_kopecks = 8;
}

message ListMastersResponse {
  repeated Master masters = 1;
  int32 total = 2;
}

message GetPublicMasterRequest {
  string slug = 1;
}

message ListForModerationRequest {
  string status_filter = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ModerateMasterRequest {
  string master_id = 1;
  // Deprecated: server ignores this field; moderator identity is taken from
  // the authenticated gRPC context (x-caller-id). Setting this field has no
  // effect and will not change who is recorded as the moderator.
  string moderator_id = 2 [deprecated = true];
  string action = 3;
  string comment = 4;
}

message ModerationHistoryEntry {
  string id = 1;
  string master_id = 2;
  string old_status = 3;
  string new_status = 4;
  string comment = 5;
  string changed_by = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListModerationHistoryRequest {
  string master_id = 1;
  int32 limit = 2;
}

message ListModerationHistoryResponse {
  repeated ModerationHistoryEntry entries = 1;
}

message CreateMasterBookingRequest {
  // Deprecated: server ignores this field; client identity is taken from
  // the authenticated gRPC context (x-caller-id). Setting this field has no
  // effect and will not change who the booking is created for.
  string client_user_id = 1 [deprecated = true];
  string master_slug = 2;
  optional string master_service_id = 3;
  string date = 4;
  string time_from = 5;
  string time_to = 6;
  string comment = 7;
}

message MasterBooking {
  string id = 1;
  string master_id = 2;
  string client_user_id = 3;
  optional string master_service_id = 4;
  string date = 5;
  string time_from = 6;
  string time_to = 7;
  string comment = 8;
  string status = 9;
  google.protobuf.Timestamp created_at = 10;
  // User id владельца профиля мастера (для чата: участник вместе с client_user_id).
  optional string master_user_id = 11;
  string payment_id = 12;
  string payment_url = 13;
  int64 total_price = 14; // kopecks
}

message MasterBookingResponse {
  MasterBooking booking = 1;
}

message ListMyMasterBookingsRequest {
  string user_id = 1;
  string status_filter = 2;
}

message ListClientMasterBookingsRequest {
  string user_id = 1;
  string status_filter = 2;
}

message ListMasterBookingsResponse {
  repeated MasterBooking bookings = 1;
}

message GetMasterBookingRequest {
  string booking_id = 1;
  string actor_user_id = 2;
}

// GetMasterBookingsBatch fetches multiple master bookings visible to actor_user_id.
// Bookings the actor cannot access are silently omitted.
// Unknown ids are silently omitted from the response map.
message GetMasterBookingsBatchRequest {
  repeated string booking_ids = 1;
  string actor_user_id = 2;
}

message GetMasterBookingsBatchResponse {
  // bookings is keyed by booking id; master_user_id is populated on each entry.
  map<string, MasterBooking> bookings = 1;
}

message HasCompletedMasterBookingRequest {
  string client_user_id = 1;
  string master_id = 2;
}

message HasCompletedMasterBookingResponse {
  bool has_completed = 1;
}

message AddMasterPhotoRequest {
  string user_id = 1;
  string url = 2;
}

message DeleteMasterPhotoRequest {
  string user_id = 1;
  string photo_id = 2;
}

message DeleteMasterPhotoResponse {
  string deleted_url = 1;
}

message SetMasterCoverPhotoRequest {
  string user_id = 1;
  string photo_id = 2;
}
