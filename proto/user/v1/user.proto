syntax = "proto3";

package user.v1;

option go_package = "github.com/tienlao/agregator/proto/user/v1;userv1";

import "google/protobuf/timestamp.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc GetUsersBatch(GetUsersBatchRequest) returns (GetUsersBatchResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  // GetUserByEmail is internal-only (service-to-service).
  // MUST NOT be proxied as a public HTTP endpoint without caller
  // authentication and rate-limiting — unprotected access enables
  // unrestricted email enumeration.
  rpc GetUserByEmail(GetUserByEmailRequest) returns (UserResponse);
}

message GetUsersBatchRequest {
  // ids must be de-duplicated by the caller; up to 200 entries.
  repeated string ids = 1;
}

message GetUsersBatchResponse {
  // Keyed by user id. Missing ids are simply absent from the map (not found / error).
  map<string, UserResponse> users = 1;
}

message CreateUserRequest {
  string id = 1;
  string email = 2;
  string phone = 3;
  string name = 4;
  string role = 5;
}

message GetUserRequest {
  string id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message UpdateUserRequest {
  string id = 1;
  optional string name = 2;
  optional string phone = 3;
  optional string avatar_url = 4;
  optional string bio = 5;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string phone = 3;
  string name = 4;
  string role = 5;
  string avatar_url = 6;
  string bio = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
