syntax = "proto3";

package chat.v1;

option go_package = "github.com/tienlao/agregator/gen/go/chat/v1;chatv1";

import "google/protobuf/timestamp.proto";

service ChatService {
  rpc EnsureThread(EnsureThreadRequest) returns (ThreadResponse);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (MessageResponse);
  rpc MarkRead(MarkReadRequest) returns (ThreadResponse);
}

message ParticipantReadState {
  string user_id = 1;
  string last_read_message_id = 2;
}

message ChatThread {
  string id = 1;
  string kind = 2; // venue_booking | master_booking
  string ref_id = 3;
  repeated string participant_user_ids = 4;
  string last_message_id = 5;
  google.protobuf.Timestamp last_message_at = 6;
  int32 unread_count = 7;
  repeated ParticipantReadState participant_reads = 8;
}

message ChatMessage {
  string id = 1;
  string thread_id = 2;
  string author_user_id = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  string client_msg_id = 6;
}

message EnsureThreadRequest {
  string kind = 1;
  string ref_id = 2;
  repeated string participant_user_ids = 3;
  // actor_user_id is the authenticated user initiating the request.
  // The chat-service validates that actor is a member of participant_user_ids.
  string actor_user_id = 4;
}

message ThreadResponse {
  ChatThread thread = 1;
}

message ListThreadsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListThreadsResponse {
  repeated ChatThread threads = 1;
  int32 total = 2;
}

message ListMessagesRequest {
  string thread_id = 1;
  string user_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListMessagesResponse {
  repeated ChatMessage messages = 1;
  int32 total = 2;
}

message SendMessageRequest {
  string thread_id = 1;
  string user_id = 2;
  string text = 3;
  string client_msg_id = 4;
}

message MessageResponse {
  ChatMessage message = 1;
  ChatThread thread = 2;
}

// MarkReadRequest marks a thread as read for the given user.
//
// N4 — known watermark race (accepted trade-off):
//   The server resolves last_read_message_id as chat_threads.last_message_id
//   at the moment the INSERT/UPDATE on chat_reads executes.  If another sender
//   inserts a message between the client's read gesture and the server write,
//   the watermark advances past a message the client has not yet rendered.
//   This is harmless for UX (the message arrives via WS-fanout anyway) but
//   means unread_count can momentarily show 0 while the new message is in
//   flight.  Acceptable for current latencies.
//
//   To eliminate the race, add an optional last_read_message_id field (field 3)
//   and have the client pass the ID of the last message it actually displayed.
//   The server would then use MIN(client_watermark, thread.last_message_id)
//   so the watermark never advances past what the user has seen.
//   When field 3 is absent the server falls back to the current behaviour.
message MarkReadRequest {
  string thread_id = 1;
  string user_id   = 2;
  // optional: see N4 comment above. Not yet sent by any client.
  // string last_seen_message_id = 3;
}
