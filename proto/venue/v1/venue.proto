syntax = "proto3";

package venue.v1;

option go_package = "github.com/tienlao/agregator/proto/venue/v1;venuev1";

import "google/protobuf/timestamp.proto";

service VenueService {
  rpc CreateVenue(CreateVenueRequest) returns (VenueResponse);
  rpc SubmitVenueForReview(SubmitVenueForReviewRequest) returns (VenueResponse);
  rpc UpdateVenue(UpdateVenueRequest) returns (VenueResponse);
  rpc GetVenue(GetVenueRequest) returns (VenueResponse);
  rpc GetVenuesBatch(GetVenuesBatchRequest) returns (GetVenuesBatchResponse);
  rpc GetVenueBySlug(GetVenueBySlugRequest) returns (VenueResponse);
  rpc ListVenues(ListVenuesRequest) returns (ListVenuesResponse);
  rpc SearchVenues(SearchVenuesRequest) returns (ListVenuesResponse);
  // ListOwnerVenues was extracted to api-gateway composition: gateway calls
  // crm.ListManagedVenues + venue.GetVenuesBatch and merges the result.
  // Do NOT add an RPC with this name back without renaming — old clients
  // may still cache the descriptor.
  rpc CheckSlotAvailability(CheckSlotRequest) returns (CheckSlotResponse);
  rpc BatchCheckSlotAvailability(BatchCheckSlotRequest) returns (BatchCheckSlotResponse);
  rpc ReserveSlot(ReserveSlotRequest) returns (ReserveSlotResponse);
  rpc ReleaseSlot(ReleaseSlotRequest) returns (ReleaseSlotResponse);
  rpc CreateManualSlotBlock(CreateManualSlotBlockRequest) returns (CreateManualSlotBlockResponse);
  rpc DeleteManualSlotBlock(DeleteManualSlotBlockRequest) returns (DeleteManualSlotBlockResponse);
  rpc ListManualSlotBlocks(ListManualSlotBlocksRequest) returns (ListManualSlotBlocksResponse);
  rpc GetVenueSchedule(GetVenueScheduleRequest) returns (GetVenueScheduleResponse);
  rpc GetVenueBookingMode(GetVenueBookingModeRequest) returns (GetVenueBookingModeResponse);
  rpc SetVenueBookingMode(SetVenueBookingModeRequest) returns (SetVenueBookingModeResponse);
  rpc UpdateRating(UpdateRatingRequest) returns (UpdateRatingResponse);
  rpc ModerateVenue(ModerateVenueRequest) returns (VenueResponse);
  rpc ListPendingVenues(ListPendingVenuesRequest) returns (ListVenuesResponse);
  // SuspendVenuesByOwner sets every venue owned by owner_id to status
  // "suspended" (skipping ones already suspended). Used by the account-deletion
  // cascade so a deleted owner's venues disappear from public listings.
  // Returns the number of rows transitioned.
  rpc SuspendVenuesByOwner(SuspendVenuesByOwnerRequest) returns (SuspendVenuesByOwnerResponse);
  rpc AddVenuePhoto(AddVenuePhotoRequest) returns (VenueResponse);
  rpc DeleteVenuePhoto(DeleteVenuePhotoRequest) returns (DeleteVenuePhotoResponse);
  rpc SetVenueCoverPhoto(SetVenueCoverPhotoRequest) returns (VenueResponse);
  rpc AddVenueHallPhoto(AddVenueHallPhotoRequest) returns (VenueResponse);
  rpc DeleteVenueHallPhoto(DeleteVenueHallPhotoRequest) returns (DeleteVenueHallPhotoResponse);
  rpc SetVenueHallCoverPhoto(SetVenueHallCoverPhotoRequest) returns (VenueResponse);
  // CRM RPCs (GetVenueManagementAccess, ListVenueStaff, AddVenueStaff,
  // RemoveVenueStaff, ListVenueCRMTasks, CreateVenueCRMTask,
  // CompleteVenueCRMTask) were extracted to crm-service
  // (proto/crm/v1/crm.proto). Do not re-introduce them here.
}

message SuspendVenuesByOwnerRequest {
  string owner_id = 1;
}

message SuspendVenuesByOwnerResponse {
  int32 suspended_count = 1;
}

message CreateVenueRequest {
  string owner_id = 1;
  string name = 2;
  string type = 3; // banya, sauna, hammam, fitobochka
  string description = 4;
  string address = 5;
  double latitude = 6;
  double longitude = 7;
  int64 price_from = 8; // in kopecks
  int32 capacity = 9;
  repeated string amenities = 10;
  string working_hours = 11; // JSON string
  string phone = 12;
  repeated VenueServiceItem services = 13;
  string city = 14;
  // Данные для проверки владельца и реальности точки (ЕГРЮЛ/ЕГРИП, карты)
  string legal_entity_name = 15;
  string inn = 16;
  string ogrn = 17;
  string public_listing_url = 18;
  string verification_note = 19;
  // JSON object of public profile URLs, e.g. {"vk":"https://vk.com/...","telegram":"https://t.me/..."}
  string social_links = 20;
  // Залы внутри заведения (опционально при создании).
  repeated VenueHallInput halls = 21;
  // Если true — статус draft (не в очереди модерации), иначе как раньше pending_review.
  bool start_as_draft = 22;
  // Форма получателя выплат: ip | ooo | self_employed | gph
  string payout_legal_form = 23;

  // Tag 24 was yookassa_seller_account_id (marketplace-split model, replaced
  // by the escrow + per-partner payout method stored in payment-service).
  reserved 24;
  reserved "yookassa_seller_account_id";
}

message SubmitVenueForReviewRequest {
  string venue_id = 1;
  string owner_id = 2;
}

message UpdateVenueRequest {
  string id = 1;
  string owner_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional string address = 5;
  optional double latitude = 6;
  optional double longitude = 7;
  optional int64 price_from = 8;
  optional int32 capacity = 9;
  repeated string amenities = 10;
  optional string working_hours = 11;
  optional string phone = 12;
  optional string city = 13;
  optional string legal_entity_name = 14;
  optional string inn = 15;
  optional string ogrn = 16;
  optional string public_listing_url = 17;
  optional string verification_note = 18;
  optional string social_links = 19;
  // When set, replaces all venue_services rows for this venue (order = repeated order).
  optional VenueServicesReplace services_replace = 20;
  // Полная замена списка залов; пересчитывает price_from/capacity/amenities на карточке.
  optional VenueHallsReplace halls_replace = 21;
  optional string payout_legal_form = 22;

  // Tag 23 was optional yookassa_seller_account_id (deprecated marketplace-split).
  reserved 23;
  reserved "yookassa_seller_account_id";
}

// Full replace of the services list (owner cabinet). Empty items = remove all services.
message VenueServicesReplace {
  repeated VenueServiceItem items = 1;
}

message GetVenueRequest {
  string id = 1;
}

// GetVenuesBatch fetches multiple venues by id in a single round-trip.
// Only name and id are guaranteed; full card fields are included.
// Unknown ids are silently omitted from the response map.
message GetVenuesBatchRequest {
  repeated string ids = 1;
}

message GetVenuesBatchResponse {
  // venues is keyed by venue id.
  map<string, VenueResponse> venues = 1;
}

message GetVenueBySlugRequest {
  string slug = 1;
}

message ListVenuesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string type = 3;
  string sort_by = 4; // rating, price, distance
}

message SearchVenuesRequest {
  string query = 1;
  double latitude = 2;
  double longitude = 3;
  double radius_km = 4;
  string type = 5;
  int64 price_min = 6;
  int64 price_max = 7;
  double rating_min = 8;
  repeated string amenities = 9;
  int32 page = 10;
  int32 page_size = 11;
  // Подстрока города (как в карточке заведения), без учёта регистра
  string city = 12;
}

// ListOwnerVenuesRequest removed — api-gateway composes the owner list via
// crm.ListManagedVenues + venue.GetVenuesBatch.

message VenueResponse {
  string id = 1;
  string owner_id = 2;
  string slug = 3;
  string name = 4;
  string type = 5;
  string description = 6;
  string address = 7;
  double latitude = 8;
  double longitude = 9;
  int64 price_from = 10;
  int32 capacity = 11;
  repeated string amenities = 12;
  string working_hours = 13;
  string phone = 14;
  double avg_rating = 15;
  int32 review_count = 16;
  bool is_active = 17;
  repeated VenueServiceItem services = 18;
  repeated VenuePhoto photos = 19;
  google.protobuf.Timestamp created_at = 20;
  string status = 21; // draft, pending_review, active, rejected, suspended
  string moderation_comment = 22;
  string city = 23;
  google.protobuf.Timestamp moderated_at = 24;
  string moderated_by = 25;
  string legal_entity_name = 26;
  string inn = 27;
  string ogrn = 28;
  string public_listing_url = 29;
  string verification_note = 30;
  string social_links = 31;
  repeated VenueHall halls = 32;
  string payout_legal_form = 33;
  // Tags 34 (yookassa_seller_account_id) and 35 (management_access) were
  // removed: 34 belonged to the marketplace-split model now replaced by
  // payment-service payout rails; 35 moved to crm-service and is composed
  // into the HTTP response by api-gateway.
  reserved 34, 35;
  reserved "yookassa_seller_account_id", "management_access";
}

message ListVenuesResponse {
  repeated VenueResponse venues = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message VenueServiceItem {
  string id = 1;
  string name = 2;
  int32 duration_min = 3;
  int64 price = 4; // in kopecks
  string description = 5;
}

message VenuePhoto {
  string id = 1;
  string url = 2;
  int32 sort_order = 3;
  bool is_cover = 4;
}

message VenueHallPhoto {
  string id = 1;
  string url = 2;
  int32 sort_order = 3;
  bool is_cover = 4;
}

message VenueHall {
  string id = 1;
  string name = 2;
  int64 price_from = 3;
  int32 capacity = 4;
  repeated string amenities = 5;
  int32 sort_order = 6;
  repeated VenueHallPhoto photos = 7;
}

// id пустой — создать новый зал; с id — обновить существующий (принадлежит заведению).
message VenueHallInput {
  optional string id = 1;
  string name = 2;
  int64 price_from = 3;
  int32 capacity = 4;
  repeated string amenities = 5;
  int32 sort_order = 6;
}

message VenueHallsReplace {
  repeated VenueHallInput items = 1;
}

message CheckSlotRequest {
  string venue_id = 1;
  string date = 2; // YYYY-MM-DD
  string time_from = 3; // HH:MM
  string time_to = 4; // HH:MM
  // Halls to check; used only in per_hall mode, ignored in whole mode.
  // Empty = whole-venue availability.
  repeated string hall_ids = 5;
}

message CheckSlotResponse {
  bool available = 1;
}

// SlotInterval is a (time_from, time_to) pair within a single date.
message SlotInterval {
  string time_from = 1; // HH:MM
  string time_to   = 2; // HH:MM
}

// BatchCheckSlotRequest checks multiple intervals for the same venue and date
// in a single round-trip.
message BatchCheckSlotRequest {
  string venue_id          = 1;
  string date              = 2; // YYYY-MM-DD
  repeated SlotInterval slots = 3;
  // Halls to check; used only in per_hall mode, ignored in whole mode.
  // Empty = whole-venue availability.
  repeated string hall_ids = 4;
}

// BatchCheckSlotResponse returns one availability flag per requested slot,
// in the same order as BatchCheckSlotRequest.slots.
message BatchCheckSlotResponse {
  // available[i] corresponds to slots[i] in the request.
  repeated bool available = 1;
}

message ReserveSlotRequest {
  string venue_id = 1;
  string booking_id = 2;
  string date = 3;
  string time_from = 4;
  string time_to = 5;
  // Selected halls; used only when the venue's booking_mode is "per_hall",
  // ignored in "whole" mode. Empty = whole-venue reservation.
  repeated string hall_ids = 6;
}

message ReserveSlotResponse {
  bool success = 1;
}

message ReleaseSlotRequest {
  string venue_id = 1;
  string booking_id = 2;
}

message ReleaseSlotResponse {
  bool success = 1;
}

message ManualSlotBlock {
  string id = 1;
  string venue_id = 2;
  string date = 3;       // YYYY-MM-DD
  string time_from = 4;  // HH:MM
  string time_to = 5;    // HH:MM
  string note = 6;
  optional string hall_id = 7; // absent = whole-venue block
}

message CreateManualSlotBlockRequest {
  string owner_id = 1;
  string venue_id = 2;
  string date = 3;
  string time_from = 4;
  string time_to = 5;
  string note = 6; // optional, e.g. "бронь по телефону"
  // Halls to block in per_hall mode: specific halls, or empty = every hall
  // (whole venue). Ignored in whole mode.
  repeated string hall_ids = 7;
}

message CreateManualSlotBlockResponse {
  // One block per affected hall (a single whole-venue block in whole mode).
  repeated ManualSlotBlock blocks = 1;
}

message DeleteManualSlotBlockRequest {
  string owner_id = 1;
  string venue_id = 2;
  string block_id = 3;
}

message DeleteManualSlotBlockResponse {
  bool success = 1;
}

message ListManualSlotBlocksRequest {
  string owner_id = 1;
  string venue_id = 2;
  string date_from = 3; // YYYY-MM-DD inclusive
  string date_to = 4;   // YYYY-MM-DD inclusive
}

message ListManualSlotBlocksResponse {
  repeated ManualSlotBlock blocks = 1;
}

// ScheduleEntry is one occupied interval on the owner schedule grid: an
// aggregator booking (booking_id set) or a manual owner block (booking_id absent).
message ScheduleEntry {
  string id = 1;
  optional string booking_id = 2; // absent = manual owner block
  string date = 3;                // YYYY-MM-DD
  string time_from = 4;           // HH:MM
  string time_to = 5;             // HH:MM
  string note = 6;                // manual block note; empty for bookings
  optional string hall_id = 7;    // absent = whole-venue reservation
}

message GetVenueScheduleRequest {
  string actor_id = 1;
  string venue_id = 2;
  string date_from = 3; // YYYY-MM-DD inclusive
  string date_to = 4;   // YYYY-MM-DD inclusive
}

message GetVenueScheduleResponse {
  repeated ScheduleEntry entries = 1;
}

message GetVenueBookingModeRequest {
  string actor_id = 1;
  string venue_id = 2;
}

message GetVenueBookingModeResponse {
  string booking_mode = 1; // whole | per_hall
}

message SetVenueBookingModeRequest {
  string actor_id = 1;
  string venue_id = 2;
  string booking_mode = 3; // whole | per_hall
}

message SetVenueBookingModeResponse {
  string booking_mode = 1;
}

message UpdateRatingRequest {
  string venue_id = 1;
  double avg_rating = 2;
  int32 review_count = 3;
}

message UpdateRatingResponse {}

message ModerateVenueRequest {
  string venue_id = 1;
  string action = 2; // approve, reject, suspend, resume (из suspended → active)
  string comment = 3;
  string moderated_by = 4; // admin user ID
}

message ListPendingVenuesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3; // filter by specific status, empty = pending_review
  // optional: substring match on venue name (case-insensitive), empty = no filter
  string name_query = 4;
}

message AddVenuePhotoRequest {
  string venue_id = 1;
  string owner_id = 2;
  string url = 3; // public path, e.g. /api/v1/uploads/venues/{id}/{file}
}

message DeleteVenuePhotoRequest {
  string venue_id = 1;
  string owner_id = 2;
  string photo_id = 3;
}

message DeleteVenuePhotoResponse {
  string url = 1; // stored URL so gateway can remove file from disk
}

message SetVenueCoverPhotoRequest {
  string venue_id = 1;
  string owner_id = 2;
  string photo_id = 3;
}

message AddVenueHallPhotoRequest {
  string venue_id = 1;
  string hall_id = 2;
  string owner_id = 3;
  string url = 4;
}

message DeleteVenueHallPhotoRequest {
  string venue_id = 1;
  string hall_id = 2;
  string owner_id = 3;
  string photo_id = 4;
}

message DeleteVenueHallPhotoResponse {
  string url = 1;
}

message SetVenueHallCoverPhotoRequest {
  string venue_id = 1;
  string hall_id = 2;
  string owner_id = 3;
  string photo_id = 4;
}

// All CRM message types (Get/List/Add/Remove staff, CRM tasks) were extracted
// to proto/crm/v1/crm.proto. See the reserved field declarations on the
// VenueService and Venue message above.
