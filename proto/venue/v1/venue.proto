syntax = "proto3";

package venue.v1;

option go_package = "github.com/tienlao/agregator/proto/venue/v1;venuev1";

import "google/protobuf/timestamp.proto";

service VenueService {
  rpc CreateVenue(CreateVenueRequest) returns (VenueResponse);
  rpc SubmitVenueForReview(SubmitVenueForReviewRequest) returns (VenueResponse);
  rpc UpdateVenue(UpdateVenueRequest) returns (VenueResponse);
  rpc GetVenue(GetVenueRequest) returns (VenueResponse);
  rpc GetVenueBySlug(GetVenueBySlugRequest) returns (VenueResponse);
  rpc ListVenues(ListVenuesRequest) returns (ListVenuesResponse);
  rpc SearchVenues(SearchVenuesRequest) returns (ListVenuesResponse);
  rpc ListOwnerVenues(ListOwnerVenuesRequest) returns (ListVenuesResponse);
  rpc CheckSlotAvailability(CheckSlotRequest) returns (CheckSlotResponse);
  rpc ReserveSlot(ReserveSlotRequest) returns (ReserveSlotResponse);
  rpc ReleaseSlot(ReleaseSlotRequest) returns (ReleaseSlotResponse);
  rpc CreateManualSlotBlock(CreateManualSlotBlockRequest) returns (CreateManualSlotBlockResponse);
  rpc DeleteManualSlotBlock(DeleteManualSlotBlockRequest) returns (DeleteManualSlotBlockResponse);
  rpc ListManualSlotBlocks(ListManualSlotBlocksRequest) returns (ListManualSlotBlocksResponse);
  rpc UpdateRating(UpdateRatingRequest) returns (UpdateRatingResponse);
  rpc ModerateVenue(ModerateVenueRequest) returns (VenueResponse);
  rpc ListPendingVenues(ListPendingVenuesRequest) returns (ListVenuesResponse);
  rpc AddVenuePhoto(AddVenuePhotoRequest) returns (VenueResponse);
  rpc DeleteVenuePhoto(DeleteVenuePhotoRequest) returns (DeleteVenuePhotoResponse);
  rpc SetVenueCoverPhoto(SetVenueCoverPhotoRequest) returns (VenueResponse);
  rpc AddVenueHallPhoto(AddVenueHallPhotoRequest) returns (VenueResponse);
  rpc DeleteVenueHallPhoto(DeleteVenueHallPhotoRequest) returns (DeleteVenueHallPhotoResponse);
  rpc SetVenueHallCoverPhoto(SetVenueHallCoverPhotoRequest) returns (VenueResponse);
}

message CreateVenueRequest {
  string owner_id = 1;
  string name = 2;
  string type = 3; // banya, sauna, hammam, fitobochka
  string description = 4;
  string address = 5;
  double latitude = 6;
  double longitude = 7;
  int64 price_from = 8; // in kopecks
  int32 capacity = 9;
  repeated string amenities = 10;
  string working_hours = 11; // JSON string
  string phone = 12;
  repeated VenueServiceItem services = 13;
  string city = 14;
  // Данные для проверки владельца и реальности точки (ЕГРЮЛ/ЕГРИП, карты)
  string legal_entity_name = 15;
  string inn = 16;
  string ogrn = 17;
  string public_listing_url = 18;
  string verification_note = 19;
  // JSON object of public profile URLs, e.g. {"vk":"https://vk.com/...","telegram":"https://t.me/..."}
  string social_links = 20;
  // Залы внутри заведения (опционально при создании).
  repeated VenueHallInput halls = 21;
  // Если true — статус draft (не в очереди модерации), иначе как раньше pending_review.
  bool start_as_draft = 22;
}

message SubmitVenueForReviewRequest {
  string venue_id = 1;
  string owner_id = 2;
}

message UpdateVenueRequest {
  string id = 1;
  string owner_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional string address = 5;
  optional double latitude = 6;
  optional double longitude = 7;
  optional int64 price_from = 8;
  optional int32 capacity = 9;
  repeated string amenities = 10;
  optional string working_hours = 11;
  optional string phone = 12;
  optional string city = 13;
  optional string legal_entity_name = 14;
  optional string inn = 15;
  optional string ogrn = 16;
  optional string public_listing_url = 17;
  optional string verification_note = 18;
  optional string social_links = 19;
  // When set, replaces all venue_services rows for this venue (order = repeated order).
  optional VenueServicesReplace services_replace = 20;
  // Полная замена списка залов; пересчитывает price_from/capacity/amenities на карточке.
  optional VenueHallsReplace halls_replace = 21;
}

// Full replace of the services list (owner cabinet). Empty items = remove all services.
message VenueServicesReplace {
  repeated VenueServiceItem items = 1;
}

message GetVenueRequest {
  string id = 1;
}

message GetVenueBySlugRequest {
  string slug = 1;
}

message ListVenuesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string type = 3;
  string sort_by = 4; // rating, price, distance
}

message SearchVenuesRequest {
  string query = 1;
  double latitude = 2;
  double longitude = 3;
  double radius_km = 4;
  string type = 5;
  int64 price_min = 6;
  int64 price_max = 7;
  double rating_min = 8;
  repeated string amenities = 9;
  int32 page = 10;
  int32 page_size = 11;
  // Подстрока города (как в карточке заведения), без учёта регистра
  string city = 12;
}

message ListOwnerVenuesRequest {
  string owner_id = 1;
}

message VenueResponse {
  string id = 1;
  string owner_id = 2;
  string slug = 3;
  string name = 4;
  string type = 5;
  string description = 6;
  string address = 7;
  double latitude = 8;
  double longitude = 9;
  int64 price_from = 10;
  int32 capacity = 11;
  repeated string amenities = 12;
  string working_hours = 13;
  string phone = 14;
  double avg_rating = 15;
  int32 review_count = 16;
  bool is_active = 17;
  repeated VenueServiceItem services = 18;
  repeated VenuePhoto photos = 19;
  google.protobuf.Timestamp created_at = 20;
  string status = 21; // draft, pending_review, active, rejected, suspended
  string moderation_comment = 22;
  string city = 23;
  google.protobuf.Timestamp moderated_at = 24;
  string moderated_by = 25;
  string legal_entity_name = 26;
  string inn = 27;
  string ogrn = 28;
  string public_listing_url = 29;
  string verification_note = 30;
  string social_links = 31;
  repeated VenueHall halls = 32;
}

message ListVenuesResponse {
  repeated VenueResponse venues = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message VenueServiceItem {
  string id = 1;
  string name = 2;
  int32 duration_min = 3;
  int64 price = 4; // in kopecks
  string description = 5;
}

message VenuePhoto {
  string id = 1;
  string url = 2;
  int32 sort_order = 3;
  bool is_cover = 4;
}

message VenueHallPhoto {
  string id = 1;
  string url = 2;
  int32 sort_order = 3;
  bool is_cover = 4;
}

message VenueHall {
  string id = 1;
  string name = 2;
  int64 price_from = 3;
  int32 capacity = 4;
  repeated string amenities = 5;
  int32 sort_order = 6;
  repeated VenueHallPhoto photos = 7;
}

// id пустой — создать новый зал; с id — обновить существующий (принадлежит заведению).
message VenueHallInput {
  optional string id = 1;
  string name = 2;
  int64 price_from = 3;
  int32 capacity = 4;
  repeated string amenities = 5;
  int32 sort_order = 6;
}

message VenueHallsReplace {
  repeated VenueHallInput items = 1;
}

message CheckSlotRequest {
  string venue_id = 1;
  string date = 2; // YYYY-MM-DD
  string time_from = 3; // HH:MM
  string time_to = 4; // HH:MM
}

message CheckSlotResponse {
  bool available = 1;
}

message ReserveSlotRequest {
  string venue_id = 1;
  string booking_id = 2;
  string date = 3;
  string time_from = 4;
  string time_to = 5;
}

message ReserveSlotResponse {
  bool success = 1;
}

message ReleaseSlotRequest {
  string venue_id = 1;
  string booking_id = 2;
}

message ReleaseSlotResponse {
  bool success = 1;
}

message ManualSlotBlock {
  string id = 1;
  string venue_id = 2;
  string date = 3;       // YYYY-MM-DD
  string time_from = 4;  // HH:MM
  string time_to = 5;    // HH:MM
  string note = 6;
}

message CreateManualSlotBlockRequest {
  string owner_id = 1;
  string venue_id = 2;
  string date = 3;
  string time_from = 4;
  string time_to = 5;
  string note = 6; // optional, e.g. "бронь по телефону"
}

message CreateManualSlotBlockResponse {
  ManualSlotBlock block = 1;
}

message DeleteManualSlotBlockRequest {
  string owner_id = 1;
  string venue_id = 2;
  string block_id = 3;
}

message DeleteManualSlotBlockResponse {
  bool success = 1;
}

message ListManualSlotBlocksRequest {
  string owner_id = 1;
  string venue_id = 2;
  string date_from = 3; // YYYY-MM-DD inclusive
  string date_to = 4;   // YYYY-MM-DD inclusive
}

message ListManualSlotBlocksResponse {
  repeated ManualSlotBlock blocks = 1;
}

message UpdateRatingRequest {
  string venue_id = 1;
  double avg_rating = 2;
  int32 review_count = 3;
}

message UpdateRatingResponse {}

message ModerateVenueRequest {
  string venue_id = 1;
  string action = 2; // approve, reject, suspend
  string comment = 3;
  string moderated_by = 4; // admin user ID
}

message ListPendingVenuesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3; // filter by specific status, empty = pending_review
}

message AddVenuePhotoRequest {
  string venue_id = 1;
  string owner_id = 2;
  string url = 3; // public path, e.g. /api/v1/uploads/venues/{id}/{file}
}

message DeleteVenuePhotoRequest {
  string venue_id = 1;
  string owner_id = 2;
  string photo_id = 3;
}

message DeleteVenuePhotoResponse {
  string url = 1; // stored URL so gateway can remove file from disk
}

message SetVenueCoverPhotoRequest {
  string venue_id = 1;
  string owner_id = 2;
  string photo_id = 3;
}

message AddVenueHallPhotoRequest {
  string venue_id = 1;
  string hall_id = 2;
  string owner_id = 3;
  string url = 4;
}

message DeleteVenueHallPhotoRequest {
  string venue_id = 1;
  string hall_id = 2;
  string owner_id = 3;
  string photo_id = 4;
}

message DeleteVenueHallPhotoResponse {
  string url = 1;
}

message SetVenueHallCoverPhotoRequest {
  string venue_id = 1;
  string hall_id = 2;
  string owner_id = 3;
  string photo_id = 4;
}
