syntax = "proto3";

package payment.v1;

option go_package = "github.com/tienlao/agregator/proto/payment/v1;paymentv1";

import "google/protobuf/timestamp.proto";

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (PaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (PaymentResponse);
  rpc GetPaymentByBooking(GetPaymentByBookingRequest) returns (PaymentResponse);
  rpc HandleWebhook(WebhookRequest) returns (WebhookResponse);
}

message CreatePaymentRequest {
  string booking_id = 1;
  int64 amount = 2; // kopecks (gross)
  string description = 3;
  string return_url = 4;
  string idempotency_key = 5;
  // Counterparty for marketplace split: venue | master
  string counterparty_type = 6;
  string counterparty_id = 7;
  // Deprecated: use provider_seller_account_id instead.
  // Kept for backward compatibility; will be removed in a future release.
  string yookassa_seller_account_id = 8 [deprecated = true];
  // provider_seller_account_id is the marketplace seller account at the payment
  // provider (provider-agnostic replacement for yookassa_seller_account_id).
  // When non-empty the provider creates a split payment with deferred capture.
  string provider_seller_account_id = 9;
  // provider_name identifies the payment gateway to use (default: "yookassa").
  // Reserved for future use when multiple providers are supported in parallel.
  string provider_name = 10;
}

message PaymentResponse {
  string id = 1;
  string booking_id = 2;
  int64 amount = 3;
  string status = 4; // pending, succeeded, cancelled, refunded
  string payment_url = 5;
  string provider_id = 6;
  google.protobuf.Timestamp created_at = 7;
  int64 platform_fee_kopecks = 8;
  int64 counterparty_net_kopecks = 9;
  string provider_name = 10;
}

message GetPaymentRequest {
  string id = 1;
}

message GetPaymentByBookingRequest {
  string booking_id = 1;
}

message WebhookRequest {
  bytes raw_body = 1;
}

message WebhookResponse {
  bool ok = 1;
}
