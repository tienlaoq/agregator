syntax = "proto3";

package auth.v1;

option go_package = "github.com/tienlao/agregator/proto/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc OAuthLogin(OAuthLoginRequest) returns (OAuthLoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (CompletePasswordResetResponse);
  // DeleteAccount revokes all authentication material for a user: the
  // credential row (password / OAuth identity) and every outstanding refresh
  // token. After this call the user can no longer authenticate. Idempotent —
  // deleting an already-revoked account is a no-op success.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  // VerifyEmail consumes a one-time verification token and marks the owning
  // account's email as verified. Single-use: replaying the token fails.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  // ResendVerification re-issues a verification link. Anti-enumeration: the
  // response is identical whether or not the email exists or is already verified.
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse);
  // GetEmailVerification reports whether an account's email is verified. Used by
  // the gateway to gate partner actions (venue / master profile creation).
  rpc GetEmailVerification(GetEmailVerificationRequest) returns (GetEmailVerificationResponse);
}

message RegisterRequest {
  string email = 1;
  string phone = 2;
  string password = 3;
  string name = 4;
  string role = 5; // user, venue_owner, master
}

message RegisterResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
  string email = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message OAuthLoginRequest {
  string provider = 1;    // "google" or "vk"
  string provider_id = 2; // provider's unique user ID
  string email = 3;
  string name = 4;
  string avatar_url = 5;
  // email_verified must be set to true only when the OAuth provider has
  // cryptographically confirmed ownership of the email address.
  // When false, the email may not be used to link to an existing account
  // (prevents account-takeover via unverified email from a rogue provider).
  bool email_verified = 6;
}

message OAuthLoginResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  bool is_new_user = 4;
}

message LogoutResponse {}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {}

message CompletePasswordResetRequest {
  string token = 1;
  string new_password = 2;
}

message CompletePasswordResetResponse {}

message DeleteAccountRequest {
  string user_id = 1;
}

message DeleteAccountResponse {}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {}

message ResendVerificationRequest {
  string email = 1;
}

message ResendVerificationResponse {}

message GetEmailVerificationRequest {
  string user_id = 1;
}

message GetEmailVerificationResponse {
  bool email_verified = 1;
}
