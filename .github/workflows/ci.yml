name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - venue-service
          - booking-service
          - review-service
          - payment-service
          - master-service
          - chat-service
          - crm-service
          - notification-service
          - analytics-service
          - migrator
          - api-gateway
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: |
            services/${{ matrix.service }}/go.sum
            go.work.sum

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        working-directory: ${{ github.workspace }}
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate proto code
        working-directory: ${{ github.workspace }}
        run: buf generate

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  migrations:
    name: Migration from-scratch check
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS image because venue-service migrations use PostGIS types.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Postgres
        env:
          PGPASSWORD: postgres
        # The PostGIS entrypoint restarts once during init (logs "ready" twice),
        # so require two consecutive successful queries before proceeding.
        run: |
          ok=0
          for i in $(seq 1 60); do
            if psql -h localhost -U postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              ok=$((ok + 1))
              [ "$ok" -ge 2 ] && exit 0
            else
              ok=0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Apply every service's migrations from scratch
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash deploy/check-migrations.sh

  frontend:
    name: Frontend lint/test/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run -- --passWithNoTests

      - name: Build
        run: npm run build