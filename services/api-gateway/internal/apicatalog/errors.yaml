# HTTP API error catalog for api-gateway (machine codes + default messages).
# Regenerate: from services/api-gateway: go generate ./internal/apicatalog/...
version: 1
errors:
  - http_status: 401
    code: GATEWAY.AUTH.UNAUTHORIZED
    message: "Требуется авторизация"

  - http_status: 400
    code: GATEWAY.REQUEST.INVALID_BODY
    message: "Некорректное тело запроса"

  - http_status: 400
    code: GATEWAY.REQUEST.INVALID_JSON
