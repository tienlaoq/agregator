version: v2
# Локальные плагины (в PATH): `go install google.golang.org/protobuf/cmd/protoc-gen-go@latest`
# и `go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest` — без удалённого buf registry.
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
