<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Banya</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: -apple-system, system-ui, sans-serif;
        background: #0b0b0c;
        color: #e5e5e7;
        text-align: center;
        padding: 24px;
      }
      p { opacity: 0.7; }
      button {
        margin-top: 16px;
        padding: 12px 32px;
        font: inherit;
        color: inherit;
        background: #2c2c2e;
        border: none;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <!-- Экран ошибки: Capacitor открывает его через server.errorPath, когда
         server.url не загрузился (нет сети). -->
    <div>
      <h1>Banya</h1>
      <p>Нет подключения к интернету.<br />Проверьте сеть и попробуйте снова.</p>
      <button onclick="retry()">Повторить</button>
    </div>
    <script>
      // ponytail: держать в синхроне с serverUrl в capacitor.config.ts —
      // set real prod domain before store submit.
      var SERVER_URL = "https://example.com";
      function retry() {
        location.href = SERVER_URL;
      }
      // Сеть вернулась — уходим на сайт сами, без тапа.
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
