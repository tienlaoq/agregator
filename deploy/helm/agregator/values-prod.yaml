# Production overrides — applied on top of values.yaml:
#   helm upgrade --install agregator deploy/helm/agregator -f deploy/helm/agregator/values-prod.yaml
# (the CD pipeline already passes this file). Helm deep-merges maps, so only the
# environment-specific keys live here; everything else stays in values.yaml.
#
# ⚠️ NO SECRETS HERE. This file is committed. Passwords, tokens and keys go into
#    Kubernetes secrets via deploy/helm/secrets/generate-secrets.sh. This file
#    holds only non-sensitive infra config (registry, hosts, IDs, domains).
#
# Replace every CHANGE_ME, then commit. Deploy is manual (workflow_dispatch), so
# nothing ships until you fill these and click "Run workflow".

global:
  # Yandex Container Registry. The CD pipeline overrides this via --set, but set
  # it for manual `helm` runs: <registry>/<repository-prefix>.
  registry: "cr.yandex/CHANGE_ME"
  env:
    # Managed PostgreSQL host (FQDN). Keep PG_PORT/USER/SSLMODE from values.yaml.
    PG_HOST: "CHANGE_ME.mdb.yandexcloud.net"
    # REDIS_ADDR / NATS_URL default to the in-cluster services — override only if
    # you switch to managed Redis (and set redis.enabled=false in values.yaml).

services:
  auth-service:
    env:
      FRONTEND_URL: "https://CHANGE_ME.ru"
  venue-service:
    env:
      FRONTEND_URL: "https://CHANGE_ME.ru"
  payment-service:
    env:
      PAYMENT_RETURN_URL: "https://CHANGE_ME.ru/my/bookings"
  api-gateway:
    env:
      BASE_URL: "https://api.CHANGE_ME.ru"
      FRONTEND_URL: "https://CHANGE_ME.ru"
      # Comma-separated allowed browser origins (no trailing slash).
      CORS_ALLOWED_ORIGINS: "https://CHANGE_ME.ru"
      # Public base URL of the media bucket (Object Storage).
      MINIO_PUBLIC_BASE_URL: "https://storage.yandexcloud.net/CHANGE_ME"
      # In-cluster CIDR of the edge (ALB/ingress) so X-Forwarded-For is trusted.
      # Narrow to the LB/ingress subnet; "" disables XFF trust (safe default).
      TRUSTED_PROXY_CIDRS: "CHANGE_ME"
      # MINIO_ENDPOINT/BUCKET/USE_SSL default to YC Object Storage in values.yaml.

# Edge / TLS — Yandex ALB Ingress (see deploy/helm/INGRESS.md). group-name and
# external-ipv4-address stay from values.yaml; fill the env-specific bits here.
ingress:
  host: "api.CHANGE_ME.ru"
  tlsSecretName: "yc-certmgr-cert-id-CHANGE_ME"
  annotations:
    ingress.alb.yc.io/subnets: "CHANGE_ME"          # comma-separated subnet IDs
    ingress.alb.yc.io/security-groups: "CHANGE_ME"  # comma-separated SG IDs

ingressFrontend:
  host: "CHANGE_ME.ru"
  tlsSecretName: "yc-certmgr-cert-id-CHANGE_ME"
  annotations:
    ingress.alb.yc.io/subnets: "CHANGE_ME"
    ingress.alb.yc.io/security-groups: "CHANGE_ME"
