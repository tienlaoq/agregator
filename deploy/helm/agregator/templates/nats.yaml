{{- if .Values.nats.enabled }}
# In-cluster NATS with JetStream (single node + PVC) — carries booking events,
# the payment outbox/DLQ, notifications and analytics. No managed NATS exists on
# YC, so it lives in the chart. Single replica is enough for launch; JetStream
# state survives restarts via the PVC. For HA later, switch to the upstream
# nats-io cluster chart. Services reach it at nats://{{ .Release.Name }}-nats:4222.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    {{- include "agregator.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
data:
  nats.conf: |
    port: 4222
    http: 8222
    jetstream {
      store_dir: "/data"
      max_memory_store: {{ .Values.nats.jetstream.maxMemory | quote }}
      max_file_store: {{ .Values.nats.jetstream.maxFile | quote }}
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    {{- include "agregator.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    {{- include "agregator.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ .Release.Name }}-nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nats
      annotations:
        # Roll the pod when the JetStream config changes.
        checksum/config: {{ .Values.nats.jetstream | toYaml | sha256sum }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with .Values.nats.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /etc/nats }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-nats
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.nats.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.storage }}
{{- end }}
