{{- range $name, $cfg := .Values.services }}
{{- if $cfg.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "agregator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- /* When an HPA owns this service, omit replicas so it isn't reset on each
         upgrade; otherwise pin the configured count. */}}
  {{- if not (and $cfg.hpa $cfg.hpa.enabled) }}
  replicas: {{ $cfg.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range $.Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s/%s:%s" $.Values.global.registry $cfg.image.name (default $.Values.global.imageTag $cfg.image.tag) }}
          imagePullPolicy: {{ default "IfNotPresent" $cfg.image.pullPolicy }}
          ports:
            - containerPort: {{ $cfg.port }}
              name: http
          {{- /* Merge shared global.env with the service's own env (service wins);
                 render values through tpl so "{{ .Release.Name }}" resolves. */}}
          {{- $env := merge (deepCopy ($cfg.env | default dict)) ($.Values.global.env | default dict) }}
          {{- if $env }}
          env:
            {{- range $k, $v := $env }}
            - name: {{ $k }}
              value: {{ tpl (toString $v) $ | quote }}
            {{- end }}
          {{- end }}
          {{- if $cfg.envFromSecrets }}
          envFrom:
            {{- range $secret := $cfg.envFromSecrets }}
            - secretRef:
                name: {{ $secret }}
            {{- end }}
          {{- end }}
          {{- if and $cfg.probe (ne ($cfg.probe.type | default "none") "none") }}
          {{- $pa := dict "type" $cfg.probe.type "port" ($cfg.probe.port | default $cfg.port) "path" ($cfg.probe.path | default "/") }}
          readinessProbe:
            {{- include "agregator.probeAction" $pa | nindent 12 }}
            initialDelaySeconds: {{ $cfg.probe.readinessInitialDelaySeconds | default 5 }}
            periodSeconds: {{ $cfg.probe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $cfg.probe.timeoutSeconds | default 3 }}
            failureThreshold: {{ $cfg.probe.failureThreshold | default 3 }}
          livenessProbe:
            {{- include "agregator.probeAction" $pa | nindent 12 }}
            initialDelaySeconds: {{ $cfg.probe.livenessInitialDelaySeconds | default 15 }}
            periodSeconds: {{ $cfg.probe.periodSeconds | default 20 }}
            timeoutSeconds: {{ $cfg.probe.timeoutSeconds | default 3 }}
            failureThreshold: {{ $cfg.probe.failureThreshold | default 3 }}
          {{- end }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
{{- end }}
{{- end }}