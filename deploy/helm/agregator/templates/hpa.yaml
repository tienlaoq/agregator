{{- range $name, $cfg := .Values.services }}
{{- if and $cfg.enabled $cfg.hpa $cfg.hpa.enabled }}
# HorizontalPodAutoscaler — requires metrics-server in the cluster and CPU
# requests on the target pods (set under services.{{ $name }}.resources).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "agregator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-{{ $name }}
  minReplicas: {{ $cfg.hpa.minReplicas | default 2 }}
  maxReplicas: {{ $cfg.hpa.maxReplicas | default 5 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.hpa.targetCPUUtilizationPercentage | default 70 }}
---
{{- end }}
{{- end }}
