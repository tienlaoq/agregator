{{- /*
Two host-based ingresses (api + frontend), mirroring the Caddy subdomain split.
Flexible enough for either edge:
  - Yandex Application Load Balancer Ingress Controller (RF-native managed L7):
    driven by ingress.alb.yc.io/* annotations; TLS from Certificate Manager via
    a magic secretName "yc-certmgr-cert-id-<cert-id>".
  - nginx-ingress: set className: nginx and tlsSecretName to a real TLS secret.
See deploy/helm/INGRESS.md.
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    {{- include "agregator.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api-gateway
                port:
                  number: {{ (index .Values.services "api-gateway").port }}
{{- end }}
{{- if .Values.ingressFrontend.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "agregator.labels" . | nindent 4 }}
  {{- with .Values.ingressFrontend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingressFrontend.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingressFrontend.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingressFrontend.host }}
      secretName: {{ .Values.ingressFrontend.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingressFrontend.host }}
      http:
        paths:
          - path: {{ .Values.ingressFrontend.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ (index .Values.services "frontend").port }}
{{- end }}
