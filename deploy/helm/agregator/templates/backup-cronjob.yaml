{{- if .Values.backup.enabled }}
# Scheduled logical backup of every database to S3-compatible Object Storage.
# concurrencyPolicy Forbid prevents overlapping runs if one is slow.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-pg-backup
  labels:
    {{- include "agregator.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.backoffLimit | default 2 }}
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds | default 3600 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- if .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- range .Values.global.imagePullSecrets }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          containers:
            - name: backup
              image: {{ printf "%s/%s:%s" .Values.global.registry .Values.backup.image.name (default .Values.global.imageTag .Values.backup.image.tag) }}
              imagePullPolicy: {{ default "IfNotPresent" .Values.backup.image.pullPolicy }}
              env:
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                - name: BACKUP_PREFIX
                  value: {{ .Values.backup.prefix | quote }}
              {{- if .Values.backup.envFromSecrets }}
              envFrom:
                {{- range .Values.backup.envFromSecrets }}
                - secretRef:
                    name: {{ . }}
                {{- end }}
              {{- end }}
{{- end }}
