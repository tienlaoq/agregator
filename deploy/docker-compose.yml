services:
  # Infrastructure
  postgres:
    image: postgis/postgis:16-3.4
    container_name: banya-postgres
    environment:
      POSTGRES_USER: banya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env — copy from .env.example}
      POSTGRES_DB: banya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banya"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    container_name: banya-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: banya-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--jetstream --store_dir /data --http_port 8222"

  # Services (all built from local Go code)
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: banya-auth
    ports:
      - "50051:50051"
    environment:
      GRPC_PORT: "50051"
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CERT: ${GRPC_TLS_CERT:-}
      GRPC_TLS_KEY: ${GRPC_TLS_KEY:-}
      GRPC_TLS_CA: ${GRPC_TLS_CA:-}
      PG_HOST: postgres
      PG_DB: auth_db
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env — long random string, min 32 chars}
      JWT_EC_PRIVATE_KEY: ${JWT_EC_PRIVATE_KEY:-}
      USER_SERVICE_ADDR: user-service:50052
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_DIAL_TIMEOUT: ${SMTP_DIAL_TIMEOUT:-12s}
      SMTP_SEND_TIMEOUT: ${SMTP_SEND_TIMEOUT:-45s}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-1h}
      # Читаемые логи по умолчанию; для Loki/Promtail: LOG_FORMAT=json в deploy/.env
      LOG_FORMAT: ${LOG_FORMAT:-}
      PASSWORD_RESET_VERBOSE: ${PASSWORD_RESET_VERBOSE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    container_name: banya-user
    ports:
      - "50052:50052"
    environment:
      GRPC_PORT: "50052"
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CERT: ${GRPC_TLS_CERT:-}
      GRPC_TLS_KEY: ${GRPC_TLS_KEY:-}
      PG_HOST: postgres
      PG_DB: user_db
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy

  venue-service:
    build:
      context: ..
      dockerfile: services/venue-service/Dockerfile
    container_name: banya-venue
    ports:
      - "50053:50053"
    environment:
      GRPC_PORT: "50053"
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CERT: ${GRPC_TLS_CERT:-}
      GRPC_TLS_KEY: ${GRPC_TLS_KEY:-}
      PG_HOST: postgres
      PG_DB: venue_db
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: ..
      dockerfile: services/booking-service/Dockerfile
    container_name: banya-booking
    ports:
      - "50054:50054"
    environment:
      GRPC_PORT: "50054"
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CERT: ${GRPC_TLS_CERT:-}
      GRPC_TLS_KEY: ${GRPC_TLS_KEY:-}
      GRPC_TLS_CA: ${GRPC_TLS_CA:-}
      PG_HOST: postgres
      PG_DB: booking_db
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      VENUE_SERVICE_ADDR: venue-service:50053
      PAYMENT_SERVICE_ADDR: payment-service:50056
      CRM_SERVICE_ADDR: crm-service:50059
      BOOKING_VISIT_TIMEZONE: ${BOOKING_VISIT_TIMEZONE:-Europe/Moscow}
    depends_on:
      postgres:
        condition: service_healthy
      venue-service:
        condition: service_started
      payment-service:
        condition: service_started

  review-service:
    build:
      context: ..
      dockerfile: services/review-service/Dockerfile
    container_name: banya-review
    ports:
      - "50055:50055"
    environment:
      GRPC_PORT: "50055"
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CERT: ${GRPC_TLS_CERT:-}
      GRPC_TLS_KEY: ${GRPC_TLS_KEY:-}
      GRPC_TLS_CA: ${GRPC_TLS_CA:-}
      PG_HOST: postgres
      PG_DB: review_db
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      BOOKING_SERVICE_ADDR: booking-service:50054
      VENUE_SERVICE_ADDR: venue-service:50053
      MASTER_SERVICE_ADDR: master-service:50057
    depends_on:
      postgres:
        condition: service_healthy

  master-service:
    build:
      context: ..
      dockerfile: services/master-service/Dockerfile
    container_name: banya-master
    ports:
      - "50057:50057"
    environment:
      GRPC_PORT: "50057"
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CERT: ${GRPC_TLS_CERT:-}
      GRPC_TLS_KEY: ${GRPC_TLS_KEY:-}
      GRPC_TLS_CA: ${GRPC_TLS_CA:-}
      PG_HOST: postgres
      PG_DB: master_db
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      NATS_URL: nats://nats:4222
      PAYMENT_SERVICE_ADDR: payment-service:50056
    depends_on:
      postgres:
        condition: service_healthy

  chat-service:
    build:
      context: ..
      dockerfile: services/chat-service/Dockerfile
    container_name: banya-chat
    ports:
      - "50058:50058"
    environment:
      GRPC_PORT: "50058"
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CERT: ${GRPC_TLS_CERT:-}
      GRPC_TLS_KEY: ${GRPC_TLS_KEY:-}
      PG_HOST: postgres
      PG_DB: chat_db
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      NATS_URL: nats://nats:4222
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  # Strangler-fig phase B: crm-service shares venue_db with venue-service.
  # When CRM scope grows, give it crm_db and add a backfill step.
  crm-service:
    build:
      context: ..
      dockerfile: services/crm-service/Dockerfile
    container_name: banya-crm
    ports:
      - "50059:50059"
    environment:
      GRPC_PORT: "50059"
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CERT: ${GRPC_TLS_CERT:-}
      GRPC_TLS_KEY: ${GRPC_TLS_KEY:-}
      PG_HOST: postgres
      PG_DB: venue_db
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      venue-service:
        condition: service_started

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    container_name: banya-payment
    ports:
      - "50056:50056"
    environment:
      GRPC_PORT: "50056"
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CERT: ${GRPC_TLS_CERT:-}
      GRPC_TLS_KEY: ${GRPC_TLS_KEY:-}
      PG_HOST: postgres
      PG_DB: payment_db
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      PAYMENT_RETURN_URL: ${FRONTEND_URL:-http://localhost:3000}/my/bookings
      PLATFORM_FEE_BPS: "1500"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: banya-gateway
    ports:
      - "8080:8080"
    # OAuth и прочие секреты из deploy/.env (рядом с этим compose-файлом), без пустой подстановки ${VAR:-}
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_PORT: "8080"
      UPLOAD_ROOT: /data/uploads
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-}
      AUTH_SERVICE_ADDR: auth-service:50051
      USER_SERVICE_ADDR: user-service:50052
      VENUE_SERVICE_ADDR: venue-service:50053
      BOOKING_SERVICE_ADDR: booking-service:50054
      REVIEW_SERVICE_ADDR: review-service:50055
      PAYMENT_SERVICE_ADDR: payment-service:50056
      MASTER_SERVICE_ADDR: master-service:50057
      CHAT_SERVICE_ADDR: chat-service:50058
      CRM_SERVICE_ADDR: crm-service:50059
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Google / VK: задайте GOOGLE_* и VK_* в deploy/.env (см. env_file выше).
      # Письма владельцу и CRM при приостановке / возобновлении заведения (все пять — иначе рассылка отключена).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_DIAL_TIMEOUT: ${SMTP_DIAL_TIMEOUT:-12s}
      SMTP_SEND_TIMEOUT: ${SMTP_SEND_TIMEOUT:-45s}
      SUPPORT_HELPDESK_WEBHOOK_URL: ${SUPPORT_HELPDESK_WEBHOOK_URL:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      SUPPORT_HELPDESK_WEBHOOK_TOKEN: ${SUPPORT_HELPDESK_WEBHOOK_TOKEN:-}
      SUPPORT_MODERATOR_EMAILS: ${SUPPORT_MODERATOR_EMAILS:-}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: banya
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB: support_db
      GRPC_TLS: ${GRPC_TLS:-}
      GRPC_TLS_CA: ${GRPC_TLS_CA:-}
      # Доверенные прокси: пусто = gateway смотрит наружу напрямую, XFF игнорируется (безопасный дефолт).
      # Заполни если поставишь nginx/Cloudflare перед gateway:
      #   nginx в той же docker-сети → TRUSTED_PROXY_CIDRS=172.16.0.0/12
      #   Cloudflare → перечисли диапазоны с https://www.cloudflare.com/ips-v4
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Лимит POST /auth/forgot-password на один IP (distributed при REDIS_ADDR).
      FORGOT_PASSWORD_RATE_LIMIT_MAX: ${FORGOT_PASSWORD_RATE_LIMIT_MAX:-10}
      FORGOT_PASSWORD_RATE_LIMIT_WINDOW: ${FORGOT_PASSWORD_RATE_LIMIT_WINDOW:-15m}
      FORGOT_PASSWORD_RATE_LIMIT_KEY_PREFIX: ${FORGOT_PASSWORD_RATE_LIMIT_KEY_PREFIX:-auth:forgot:}
      FORGOT_PASSWORD_RATE_LIMIT_FAIL_OPEN: ${FORGOT_PASSWORD_RATE_LIMIT_FAIL_OPEN:-true}
    volumes:
      - gateway_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      venue-service:
        condition: service_started
      booking-service:
        condition: service_started
      review-service:
        condition: service_started
      payment-service:
        condition: service_started
      master-service:
        condition: service_started
      chat-service:
        condition: service_started
      crm-service:
        condition: service_started
      nats:
        condition: service_started

  # Next.js UI (опционально): docker compose --profile frontend up -d --build
  frontend:
    profiles:
      - frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
    container_name: banya-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      INTERNAL_API_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  pgdata:
  gateway_uploads:
