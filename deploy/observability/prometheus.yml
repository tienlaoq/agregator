global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

# Every Go service exposes /metrics on an internal METRICS_ADDR listener
# (default :9100, pkg/metrics). These ports are reachable only inside the
# docker network — never publish them on the host (docs/metrics-design.md §8).
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9100"]

  - job_name: analytics-service
    static_configs:
      - targets: ["analytics-service:9100"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:9100"]

  - job_name: user-service
    static_configs:
      - targets: ["user-service:9100"]

  - job_name: venue-service
    static_configs:
      - targets: ["venue-service:9100"]

  - job_name: booking-service
    static_configs:
      - targets: ["booking-service:9100"]

  - job_name: review-service
    static_configs:
      - targets: ["review-service:9100"]

  - job_name: master-service
    static_configs:
      - targets: ["master-service:9100"]

  - job_name: chat-service
    static_configs:
      - targets: ["chat-service:9100"]

  - job_name: crm-service
    static_configs:
      - targets: ["crm-service:9100"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:9100"]

  - job_name: payment-service
    static_configs:
      - targets: ["payment-service:9100"]

  # JetStream stream depth (PAYMENTS_DLQ!) and consumer lag.
  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
