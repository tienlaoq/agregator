server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(banya-gateway).*"
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      - docker: {}
      # api-gateway: set LOG_FORMAT=json (see docker-compose.observability.yml) for stable Loki queries.
      - json:
          expressions:
            level: level
            method: method
            path: path
            status: status
            duration: duration
            request_id: request_id
      - labels:
          level:
          method:
