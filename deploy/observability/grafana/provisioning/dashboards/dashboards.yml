apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      # Подкаталоги становятся папками Grafana: dashboards/business/ → папка
      # "business" для руководства, файлы в корне — General (технические).
      foldersFromFilesStructure: true
